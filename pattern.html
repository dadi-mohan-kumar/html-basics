<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="./applicationdetails_in_forms.html" method="get">
        <label for="user">user</label>
        <input type="text" id="user" name="user" pattern="[a-zA-Z\s]+" title="enter name" required><br><br>
        <label for="mail">email:</label>
        <input type="email" name="email" id="email" pattern="[a-z0-9-.]+@gmail\.com" title="enter vaild mail" required><br><br>
        <label for="password">password:</label>
        <input type="text" id="password" name="password" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[!@#$%^&*]).{8,16}" title="enter vaild password" required><br><br>
        <button>submit</button>
    </form>
</body>
</html>
